name: bpt_inventory
description: "An Invetory Management APP by BPT."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: '^5.4.3+1'
  shared_preferences: ^2.2.3
  font_awesome_flutter: '^10.7.0'
  sizer: '^2.0.15'
  cached_network_image: ^3.3.1
  google_fonts: '^6.2.1'
  intl: '^0.19.0'
  logger: '^2.2.0'
  geolocator: '^12.0.0'
  permission_handler: '^11.3.1'
  get_it: '^7.7.0'
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.6
  path_provider: '^2.1.3'
  mobile_scanner: ^6.0.2
  flutter_svg: ^2.0.16
  flutter_datetime_picker_plus: ^2.2.0
  signature: '^5.5.0'
  flutter_rating_bar: ^4.0.1
  connectivity_plus: ^6.1.2
  supabase_flutter: ^2.8.3
  persistent_bottom_nav_bar: ^6.2.1

dev_dependencies:

  change_app_package_name: '^1.2.0'
  dependency_validator: '^4.0.0'
  flutter_lints: '^4.0.0'
  pubspec_dependency_sorter: '^1.0.5'

flutter:
  uses-material-design: true
  assets: 
    - assets/jsons/
    - assets/images/